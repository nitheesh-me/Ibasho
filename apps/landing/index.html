<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Apply a remembered day or night choice before first paint, so a returning reader sees no flash. Mirrors readTheme in src/enhance.ts. -->
    <script>
      (() => {
        try {
          const t = localStorage.getItem('ibasho.landing.theme');
          if (t === 'hiru' || t === 'yoru') document.documentElement.dataset.theme = t;
        } catch {
          // Blocked storage: keep the system scheme.
        }
      })();
    </script>
    <!--landing-head-->
  </head>
  <body>
    <!--landing-body-->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
